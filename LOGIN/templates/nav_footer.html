<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema Flask{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen flex flex-col bg-base-200">

    <!-- INICIO NAVBAR -->
    <div class="navbar bg-base-100 shadow-sm px-6">
        <div class="navbar-start">
            <span class="text-xl font-bold text-primary">MiApp</span>
        </div>
        <div class="navbar-end">
            <a href="{{ url_for('logout') }}" class="btn btn-ghost btn-sm text-error gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
                Cerrar sesion
            </a>
        </div>
    </div>
    <!-- FIN NAVBAR -->

    <!-- INICIO DE CONTENIDO -->
    <main class="flex-grow flex items-center justify-center p-6">
        {% block content %}{% endblock %}
    </main>
    <!-- FIN DE CONTENIDO -->

    <!-- INICIO FOOTER -->
    <footer class="footer footer-center bg-neutral text-neutral-content p-4">
        <aside>
            <p>Copyright © 2026 - Todos los derechos reservados</p>
        </aside>
    </footer>
    <!-- FIN FOOTER -->

</body>
</html>
