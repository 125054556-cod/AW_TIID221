<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .contenedor{
            display:flex;
            flex-direction: row;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
        }
        .card{
            width: 80px;
            height:80px;
            padding:20px;
            margin:20px;
            
        }
        .card1{
            grid-column:3;
            grid-row: span;
            display:flex;
            flex-direction: column;

        }
    </style>
</head>
<body>
    <div class="contenedor">
        <div class="card" style = "background-color: aqua;" >card</div>
        <div class="card" style = "background-color: blue;" >card</div>
        <div class="card" style = "background-color: red;" >card</div>
        <div class="card" style = "background-color: prple;" >card</div>
        <div class="card" style = "background-color: rgb(225, 255, 0);" >card</div>
        <div class="card" style = "background-color: rgb(189, 117, 197);" >card</div>
        <div class="card1" style = "background-color: rgb(0, 179, 255);" >card</div>

    </div>
    
</body>
</html>
